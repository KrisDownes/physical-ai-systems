name: Robot Reliability Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: projects/robot_reliability/robot-mission-reliability

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/robot_reliability/robot-mission-reliability/pyproject.toml

      - name: Install project
        run: |
          python -m pip install .
          python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
